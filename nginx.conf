server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    # DNS interno do Docker; resolve o nome só na hora da requisição
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://finduhouse-server:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}