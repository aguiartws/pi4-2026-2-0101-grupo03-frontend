<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revisar Respostas | FindUHouse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/revisar-respostas-aluno.css">

  <!-- Cores das respostas: verde = Sim, vermelho = Não -->
  <style>
    .toggle-group input[value="sim"]:checked + .toggle-btn {
      background: #16a34a !important;
      border-color: #16a34a !important;
      color: #fff !important;
    }

    .toggle-group input[value="nao"]:checked + .toggle-btn {
      background: #dc2626 !important;
      border-color: #dc2626 !important;
      color: #fff !important;
    }

    /* Hover suave nas opções ainda não marcadas */
    .toggle-group input[value="sim"]:not(:checked) + .toggle-btn:hover {
      border-color: #16a34a;
      color: #16a34a;
    }

    .toggle-group input[value="nao"]:not(:checked) + .toggle-btn:hover {
      border-color: #dc2626;
      color: #dc2626;
    }
  </style>
</head>

<body>

  <svg width="0" height="0" style="position:absolute">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.5 1.8 4.5 5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
    <symbol id="i-arrow-l" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  </svg>

  <div class="app" id="appLayout">

    <!-- MENU LATERAL -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-bg">
        <div class="banner-decoration banner-decoration-one"></div>
        <div class="banner-decoration banner-decoration-two"></div>
      </div>

      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Recolher menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>

      <div class="logo">
        <img src="../imagens/logo.png" alt="FindUHouse">
      </div>

      <nav class="nav">
        <!-- APENAS ESSES DOIS BOTÕES AQUI -->
        <a class="nav-item" href="perfil-aluno.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
          </svg>
          <span>Meu<br>perfil</span>
        </a>

        <a class="nav-item active" href="revisar-respostas-aluno.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          <span>Editar<br>preferências</span>
        </a>
      </nav>
    </aside>

    <!-- ÁREA DIREITA -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-decoration topbar-decoration-one"></div>
        <div class="topbar-decoration topbar-decoration-two"></div>
      </header>

      <main class="content">
        <div class="card">
          <div class="intro">
            <h1>Ajuste suas preferências</h1>
            <p>Você pode alterar qualquer resposta individualmente antes de confirmar.</p>
          </div>

          <!-- LISTA DE PERGUNTAS -->
          <div class="questions-list" id="questionsList">
            <!-- Gerado via JS -->
          </div>

          <!-- SOBRE MIM -->
          <div class="about-section">
            <label for="sobreMim">Sobre mim</label>
            <textarea id="sobreMim" maxlength="500" placeholder="Escreva um pouco sobre você..."></textarea>
            <div class="char-count">
              <span id="charCount">0 / 500</span>
            </div>
          </div>

          <!-- BOTÕES DE AÇÃO -->
          <div class="form-actions">
            <button class="back-step" id="btnVoltar" type="button">
              <svg><use href="#i-arrow-l"/></svg> Voltar
            </button>
            <button class="next" id="btnSalvar" type="button">
              Salvar alterações <svg><use href="#i-check"/></svg>
            </button>
          </div>

        </div>
      </main>
    </div>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/revisar-respostas-aluno.js?v=2"></script>

</body>
</html>
