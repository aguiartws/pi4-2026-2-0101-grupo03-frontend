<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindUHouse – Mapa de Favoritos</title>
  
  <!-- Fontes do projeto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS do Leaflet (Para o Mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- CSS da Página -->
  <link rel="stylesheet" href="../css/mapa-favoritos.css">

<body>
  <div class="app">

    <!-- SIDEBAR DO ALUNO -->
    <aside class="sidebar">
      <a class="logo" href="#" aria-label="FindUHouse">
        <img src="../imagens/logo.png" alt="FindUHouse">
      </a>

      <nav class="nav" aria-label="Menu principal">
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
          </svg>
          <span>Meu<br>perfil</span>
        </a>
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>

          <span>Buscar<br>vagas</span>
        </a>
        <a class="nav-item active" href="mapa-favoritos.html">

          <span>Mapa de<br>Favoritos</span>
        </a>
      </nav>

      <div class="sidebar-footer" aria-hidden="true"></div>

    <main class="content">
      
      <section class="page-header">
        <div class="header-text">
            <h1>As suas vagas favoritas</h1>
            <p>Veja a localização exata das repúblicas e casas que guardou em relação ao Campus 1 da PUC-Campinas.</p>
        </div>
      </section>

      <!-- CONTAINER DO MAPA -->
      <div class="map-container card">
        <div id="mapaFavoritos"></div>
      </div>

    </main>
  </div>

  <!-- JS do Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Script para renderizar o Mapa -->
  <script src="../js/mapa-favoritos.js"></script>

</html>
