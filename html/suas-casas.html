<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minhas Casas | FindUHouse</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/suas-casas.css" />
  </head>
  <body>
    <div class="app" id="appLayout">
      
      <!-- SIDEBAR PADRONIZADA -->
      <aside class="sidebar">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Recolher menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>

        <div class="logo">
          <img src="../imagens/logo-azul.png" alt="FindUHouse" />
        </div>

        <nav class="nav" aria-label="Menu principal">
          <a class="nav-item" href="perfil-proprietario.html" title="Meu perfil">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
            </svg>
            <span>Meu<br>perfil</span>
          </a>

          <a class="nav-item" href="matches-feitos-proprietario.html" title="Matches feitos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <span>Matches<br>feitos</span>
          </a>

          <a class="nav-item active" href="suas-casas.html" title="Minhas casas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>
            </svg>
            <span>Minhas<br>casas</span>
          </a>

          <a class="nav-item" href="questionario-proprietario.html" title="Adicionar casa">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>Adicionar<br>casa</span>
          </a>

          <a class="nav-item" href="configuracoes-proprietario.html" title="Configurações">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>Configurações</span>
          </a>
        </nav>
      </aside>

      <!-- CONTEÚDO -->
      <main class="content">
        
        <!-- BANNER AZUL -->
        <section class="welcome-banner">
          <div class="banner-decoration banner-decoration-one"></div>
          <div class="banner-decoration banner-decoration-two"></div>

          <div class="welcome-copy">
            <span class="eyebrow">MINHA CONTA</span>
            <h1>Minhas casas</h1>
            <p>Gerencie os anúncios ativos e acompanhe o desempenho das suas casas cadastradas.</p>
          </div>

          <div class="banner-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 44px; height: 44px;">
              <path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>
            </svg>
          </div>
        </section>

        <!-- BARRA DE AÇÃO (Botão de Anunciar) -->
        <div class="houses-toolbar">
          <button class="btn-novo" type="button" onclick="window.location.href = 'questionario-proprietario.html'">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            Anunciar Nova Casa
          </button>
        </div>

        <!-- Grelha de Casas -->
        <section class="houses-grid" id="gridCasas">
          <!-- O carregamento dinâmico entrará aqui -->
          <div id="estadoCasas">Carregando suas propriedades...</div>
        </section>
      </main>
    </div>

    <script src="../js/api.js?v=3"></script>
    <script src="../js/suas-casas.js?v=3"></script>
    <script>
      // Script para fazer o botão da sidebar funcionar
      const appLayout = document.getElementById("appLayout");
      const sidebarToggle = document.getElementById("sidebarToggle");
      if (appLayout && sidebarToggle) {
        sidebarToggle.addEventListener("click", () => {
          appLayout.classList.toggle("collapsed");
        });
      }
    </script>
  </body>
</html>
