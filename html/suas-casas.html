<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindUHouse – Suas Casas</title>
  
  <!-- Reaproveita a fonte do projeto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Link para o CSS específico desta página -->
  <link rel="stylesheet" href="../css/suas-casas.css">
</head>
<body>
  <div class="app">

    <!-- SIDEBAR (Mesma estrutura do perfil) -->
    <aside class="sidebar">
      <a class="logo" href="#" aria-label="FindUHouse">
        <img src="../imagens/logo.png" alt="FindUHouse">
      </a>

      <nav class="nav" aria-label="Menu principal">
        <a class="nav-item" href="perfil-proprietario.html">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
          </svg>
          <span>Meu<br>perfil</span>
        </a>
        <a class="nav-item active" href="suas-casas.html">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>
          </svg>
          <span>Suas<br>casas</span>
        </a>
      </nav>

      <div class="sidebar-footer" aria-hidden="true"></div>
    </aside>

    <!-- CONTEÚDO -->
    <main class="content">

      <!-- Cabeçalho da Página -->
      <section class="page-header">
        <div class="header-text">
            <h1>As suas propriedades</h1>
            <p>Faça a gestão dos anúncios que tem ativos na plataforma.</p>
        </div>
        <button class="btn-novo" type="button" onclick="window.location.href='questionario-proprietario.html'">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Nova Casa
        </button>
      </section>

      <!-- Grelha de Casas -->
      <section class="houses-grid">
        <p id="estadoCasas">Carregando casas...</p>
      </section>

    </main>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/suas-casas.js"></script>
</body>
</html>
