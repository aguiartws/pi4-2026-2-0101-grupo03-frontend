<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>FindUHouse | Perfil do Aluno</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../css/perfil-aluno.css">
</head>

<body>

  <main class="app">

    <!-- CABEÇALHO -->
    <header class="app__header">
      <a class="logo" href="index.html" aria-label="FindUHouse">
        <img src="../imagens/logo-roxa.png" alt="Logo FindUHouse">
      </a>
    </header>

    <!-- LAYOUT PRINCIPAL (SIDEBAR + CONTEÚDO) -->
    <div class="layout">

      <!-- BARRA LATERAL -->
      <aside class="sidebar">
        
        <div class="profile-info">
          <div class="avatar" aria-label="Avatar do Aluno">A</div>
          <h2>Meu Perfil</h2>
          <p>Estudante</p>
        </div>

        <nav class="sidebar-nav">
          <a href="opcoes-matches-feitos.html" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            Matches feitos
          </a>

          <a href="mapa-favoritos.html" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            Mapa
          </a>

          <a href="configuracoes-aluno.html" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            Configurações
          </a>
        </nav>

      </aside>

      <!-- CONTEÚDO PRINCIPAL -->
      <main class="content">
        
        <div class="welcome-card">
          <h1>Bem-vindo(a) de volta! 👋</h1>
          <p>Seu perfil está ativo. Explore as opções na barra lateral para gerenciar seus matches, ver o mapa ou ajustar suas preferências.</p>
        </div>

        <div class="about-card">
          <div class="about-header">
            <h2>Sobre mim</h2>
            <a href="revisar-respostas-aluno.html" class="edit-link">Editar</a>
          </div>
          <p id="sobreMimText" class="about-text">
            Carregando informações...
          </p>
        </div>

        <div class="stats-card">
          <div class="stat">
            <span class="stat-icon">💜</span>
            <div>
              <strong>0</strong>
              <span>Matches</span>
            </div>
          </div>
          <div class="stat">
            <span class="stat-icon">🏠</span>
            <div>
              <strong>0</strong>
              <span>Moradias salvas</span>
            </div>
          </div>
        </div>

      </main>

    </div>

  </main>

  <script src="../js/perfil-aluno.js"></script>

</body>

</html>
